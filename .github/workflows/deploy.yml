name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          VITE_SUPABASE_URL: https://ulnomncbhccqrynzlqqf.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_USfwfy2ONPItJiHlwecXZw_EF9x49Rp
        run: npm run build

      - name: Prepare static files
        run: |
          # El build deja el sitio estático en dist/client (y el bundle de
          # servidor en dist/server, que NO debe publicarse).
          if [ -d dist/client ]; then
            SRC=dist/client
          else
            SRC=dist
          fi
          # Solo se publica la carpeta del cliente: se copia a un directorio
          # aparte para no arrastrar dist/server ni el propio dist/client.
          rm -rf dist/publish
          cp -R "$SRC" dist/publish
          cd dist/publish
          # Red de seguridad: si el build no generó index.html, usamos el shell.
          if [ ! -f index.html ]; then cp _shell.html index.html; fi
          # Evita que Jekyll ignore carpetas que empiezan con guion bajo.
          touch .nojekyll
          echo "Contenido que se publicará en la raíz del sitio:"
          ls -la

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/publish
          destination_dir: .
          keep_files: false
          force_orphan: true
          enable_jekyll: false
          cname: gamerzonec.github.io
          # `cname` escribe el archivo CNAME en la raíz de gh-pages. Es
          # obligatorio cuando el repo se llama usuario.github.io: Pages lo usa
          # para fijar el dominio del sitio, y con `force_orphan` (que recrea la
          # rama en cada deploy) hay que volver a crearlo cada vez.